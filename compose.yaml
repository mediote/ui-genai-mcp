# Execução local sem autenticação (dev). Para testar com Entra, ajuste o .env.
services:
  mcp:
    build: .
    image: ui-genai-mcp:local
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      ENVIRONMENT: dev
      AUTH_ENABLED: "false"
      ALLOWED_HOSTS: "localhost:*,127.0.0.1:*"
      ENABLED_TOOLSETS: diagnostico,clima
