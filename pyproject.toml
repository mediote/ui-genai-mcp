[project]
name = "utg-genai-mcp"
version = "0.1.0"
description = "Servidor MCP (Starlette + Streamable HTTP) com toolsets corporativos para agentes do Microsoft Foundry."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "mcp>=2.2,<3",
    "starlette>=1.0",
    "uvicorn[standard]>=0.42",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "httpx>=0.28",
    "msal>=1.33",
    "PyJWT[crypto]>=2.10",
    "python-json-logger>=3.3",
    "anyio>=4.9",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-cov>=6.2",
    "ruff>=0.12",
    "mypy>=1.17",
]

[build-system]
requires = ["uv_build>=0.8,<1"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "utg_mcp"

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "SIM", "S", "N", "C4", "RUF",
    "ASYNC", "PT", "TRY", "DTZ", "T20", "ERA", "ANN",
]
ignore = [
    "TRY003",  # mensagens de erro contextuais são intencionais
    "RUF001",  # textos pt-BR usam caracteres acentuados
    "RUF002",
    "RUF003",
    "N818",    # exceções de domínio (PermissionDenied, ...) não usam sufixo Error
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S107", "ANN", "PT011"]
"scripts/**" = ["T20", "S"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["msal", "msal.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra --strict-markers --import-mode=importlib"

[tool.coverage.run]
source = ["utg_mcp"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
